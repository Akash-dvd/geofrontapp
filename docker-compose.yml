version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: geofrontapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geofrontapp
      POSTGRES_USER: geofrontapp_user
      POSTGRES_PASSWORD: geofrontapp_password_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geofrontapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofrontapp_user -d geofrontapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    image: strapi/strapi:latest
    container_name: geofrontapp_strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Server
      HOST: 0.0.0.0
      PORT: 1337
      
      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: geofrontapp
      DATABASE_USERNAME: geofrontapp_user
      DATABASE_PASSWORD: geofrontapp_password_2025
      DATABASE_SSL: false
      
      # Security secrets (CHANGE THESE IN PRODUCTION!)
      APP_KEYS: toBeModified1,toBeModified2,toBeModified3,toBeModified4
      API_TOKEN_SALT: tobemodified
      ADMIN_JWT_SECRET: tobemodified
      TRANSFER_TOKEN_SALT: tobemodified
      JWT_SECRET: tobemodified
      
      # Admin panel
      ADMIN_PATH: /admin
      
      # Node environment
      NODE_ENV: development
    ports:
      - "1337:1337"
    volumes:
      - strapi_data:/srv/app
    networks:
      - geofrontapp_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  geofrontapp_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  strapi_data:
    driver: local
