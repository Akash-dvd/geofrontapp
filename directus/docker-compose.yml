version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: geofrontapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geofrontapp
      POSTGRES_USER: geofrontapp_user
      POSTGRES_PASSWORD: geofrontapp_password_2025
    volumes:
      - geofrontapp_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofrontapp_user -d geofrontapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11.2.1
    container_name: geofrontapp_directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      # Security
      KEY: "a8f5f167f44f4964e6c998dee827110c3d4e7f5e6b8c9d0a1b2c3d4e5f6a7b8c"
      SECRET: "9e5a8b3c7d2f1e4a6b9c8d7e5f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5"
      
      # Admin user (first time setup)
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "geofrontapp_admin_2025"
      
      # Database
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "geofrontapp"
      DB_USER: "geofrontapp_user"
      DB_PASSWORD: "geofrontapp_password_2025"
      
      # General
      PUBLIC_URL: "http://192.168.1.3:8055"
      
      # CORS (allow Flutter app)
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080,http://192.168.1.4:8080,http://192.168.1.3:8080,http://0.0.0.0:8080,http://localhost:8080,http://127.0.0.1:8080"
      CORS_CREDENTIALS: "true"
      
      # GraphQL
      GRAPHQL_ENABLED: "true"
      GRAPHQL_INTROSPECTION: "true"
      
      # File storage
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_ROOT: "./uploads"
      
      # Extensions
      EXTENSIONS_AUTO_RELOAD: "true"
      
      # Cache
      CACHE_ENABLED: "false"
      
      # Rate limiting (disable for development)
      RATE_LIMITER_ENABLED: "false"
      
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  geofrontapp_postgres_data:
  directus_uploads:
  directus_extensions:
