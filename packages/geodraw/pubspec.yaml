name: geodraw
description: Interactive geometry construction engine for GeoFrontApp
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Local calculation package
  frontcalc:
    path: ../frontcalc
  # Equatable for value equality
  equatable: ^2.0.5
  # Collection utilities
  collection: ^1.18.0
  # HTTP client for AI service
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
