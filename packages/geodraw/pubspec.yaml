name: geodraw
description: Interactive geometry construction engine for GeoFrontApp
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Local calculation package
  geocalc:
    path: ../geocalc
  # Equatable for value equality
  equatable: ^2.0.5
  # Collection utilities
  collection: ^1.18.0
  # HTTP client for AI service
  http: ^1.2.0
  designsystem:
    path: ../designsystem
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/tool_icons/
