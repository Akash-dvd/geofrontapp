table:
  name: images
  schema: public
array_relationships:
  - name: problems
    using:
      foreign_key_constraint_on:
        column: image_id
        table:
          name: problems
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - storage_key
        - filename
        - mime
        - size
        - width
        - height
        - thumb_key
        - title
        - description
        - owner_uid
        - created_at
        - updated_at
      filter:
        _or:
          - owner_uid:
              _eq: X-Hasura-User-Id
          - problems:
              _or:
                - owner_uid:
                    _eq: X-Hasura-User-Id
                - status:
                    _eq: published
insert_permissions:
  - role: user
    permission:
      check:
        owner_uid:
          _eq: X-Hasura-User-Id
      set:
        owner_uid: x-hasura-User-Id
      columns:
        - storage_key
        - filename
        - mime
        - size
        - width
        - height
        - thumb_key
        - title
        - description
update_permissions:
  - role: user
    permission:
      columns:
        - storage_key
        - filename
        - mime
        - size
        - width
        - height
        - thumb_key
        - title
        - description
      filter:
        owner_uid:
          _eq: X-Hasura-User-Id
      check:
        owner_uid:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        owner_uid:
          _eq: X-Hasura-User-Id
