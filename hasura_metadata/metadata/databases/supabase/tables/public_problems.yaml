table:
  name: problems
  schema: public
object_relationships:
  - name: image
    using:
      foreign_key_constraint_on: image_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - title
        - description
        - difficulty
        - category
        - geometry_data
        - solution
        - scalar_constraints
        - object_constraints
        - scalar_proof
        - object_proof
        - status
        - image_id
        - owner_uid
        - created_at
        - updated_at
      filter:
        _or:
          - owner_uid:
              _eq: X-Hasura-User-Id
          - status:
              _eq: published
insert_permissions:
  - role: user
    permission:
      check:
        owner_uid:
          _eq: X-Hasura-User-Id
      set:
        owner_uid: x-hasura-User-Id
        status: draft
      columns:
        - title
        - description
        - difficulty
        - category
        - geometry_data
        - solution
        - scalar_constraints
        - object_constraints
        - scalar_proof
        - object_proof
        - image_id
update_permissions:
  - role: user
    permission:
      columns:
        - title
        - description
        - difficulty
        - category
        - geometry_data
        - solution
        - scalar_constraints
        - object_constraints
        - scalar_proof
        - object_proof
        - status
        - image_id
      filter:
        owner_uid:
          _eq: X-Hasura-User-Id
      check:
        owner_uid:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        owner_uid:
          _eq: X-Hasura-User-Id
