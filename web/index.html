<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="geofrontapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>geofrontapp</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Handle unhandled promise rejections (e.g., Supabase OAuth errors)
    window.addEventListener('unhandledrejection', function(event) {
      const error = event.reason;
      // Suppress known Supabase OAuth errors that don't affect app functionality
      if (error && typeof error === 'object') {
        const message = error.message || error.toString();
        if (message && message.includes('Code verifier could not be found')) {
          // Silently handle stale OAuth sessions - no console output needed
          event.preventDefault(); // Prevent error from appearing in console
          return;
        }
      }
      // Let other errors propagate normally
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
